name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run example

  graph:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dg-vendor-subgraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/dg-vendor-subgraph/package-lock.json
      - run: npm ci
      - run: npm run codegen
      - run: npm run build
